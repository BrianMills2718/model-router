<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
function renderMd(id, item) {
  const host = document.getElementById(id); if (!host || !window.marked) return;
  host.innerHTML = marked.parse(item.text);
  if (item.base) host.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#|\/)/i.test(h)) a.href = new URL(h, item.base).href;
  });
  host.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
}
// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  const v = GraphViewer.mount(el, {graph: g, onLayout: D.full ? undefined : sized(el)});
  if (D.full && v && v.fullPage) setTimeout(() => v.fullPage(true), 300);
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = () => mermaid.run({querySelector: '.mermaid:not([data-processed])'});
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {

}
